spring:
  application:
    name: task
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bookingDb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api